name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate all package.json files
        run: |
          for f in $(find . -name "package.json" -not -path "*/node_modules/*"); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "valid: $f"
          done

      - name: Check package structure
        run: |
          for pkg in api-spec api-client-react api-zod db integrations-openai-ai-server integrations-openai-ai-react; do
            [ -d "$pkg" ] && echo "$pkg/ present" || (echo "$pkg/ missing" && exit 1)
          done

      - name: Check for forbidden platform references
        run: |
          if grep -rI "@replit\|REPL_ID\|REPLIT_DOMAINS\|REPLIT_DEV_DOMAIN" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --exclude-dir=".github" . 2>/dev/null; then
            echo "Forbidden platform references found" && exit 1
          fi
          echo "Clean"
