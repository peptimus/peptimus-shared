name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PEPTIMUS_APP_ID }}
          private-key: ${{ secrets.PEPTIMUS_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate all package.json files
        run: |
          for f in $(find . -name "package.json" -not -path "*/node_modules/*"); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "valid: $f"
          done

      - name: Check package structure
        run: |
          for pkg in api-spec api-client-react api-zod db integrations-openai-ai-server integrations-openai-ai-react; do
            [ -d "$pkg" ] && echo "$pkg/ present" || (echo "$pkg/ missing" && exit 1)
          done

      - name: Check no Replit artifacts
        run: |
          if grep -rI "@replit\|REPL_ID\|REPLIT" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --exclude-dir=".github" . 2>/dev/null; then
            echo "Replit artifacts found" && exit 1
          fi
          echo "Clean - no Replit artifacts"
